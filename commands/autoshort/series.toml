description = "Plan a multi-episode AutoShort series: save, review, confirm the season plan, then produce episodes"
prompt = """
Plan a multi-episode faceless short series on the user's AutoShort account. The rule: a season is fully designed, reviewed and confirmed by the user before any episode is produced. The server enforces it too and answers with an error and a `nextAction` when a step is skipped. Follow the rules in GEMINI.md.

The user's premise (may be empty): {{args}}

Ground rules
- If `autoshort_save_season_plan` is not among the AutoShort tools, the season-plan feature is not available to this connection: say so and stop. Do not fake it with `autoshort_create_series` schedules; offer `/autoshort:short` for single videos.
- Everything that costs credits is priced by a tool first and approved by the user in words. Quote prices, season totals and balances from tool output only.
- Characters are original, fictional and clearly adult (or an animal, robot or mascot). No real or famous people, lookalikes, brands, protected characters or sexual content.
- Create series paused. Do not resume, auto-post or schedule unless the user asks. Do not promise results.

1. Premise. Ask for the premise in one to three sentences, the genre, the number of episodes and the narration language. Call `autoshort_plan_drama_season` (free, saves nothing) for a character bible and a draft of every episode. Show the cast with a one-line look each, then a table of episodes with title, logline and closing cliffhanger. It is a proposal: edit it together. Episodes that come back with `needsEditing: true` must be fixed before they go in a plan.

2. Series and cast. `autoshort_list_series`, then for a new story `autoshort_create_series` with `startPaused: true` (free). For each character, call `autoshort_get_character_sheet` (free) and tell the user the exact price it returns and how many sheets the series may still make. Call `autoshort_create_character_sheet` only after a clear yes to that price, with the look as `description` and an `idempotencyKey`. Show the images; `autoshort_select_character_image` picks another one. `autoshort_list_options` lists narrator voices with any extra credits; pick one narrator for the season and say what it costs if it is not the default.

3. Save the plan (free). Call `autoshort_save_season_plan` with `seriesId` and `plan`, following the tool's input schema exactly. One character per episode, the same outfit in every episode, one narrator and one style for the season. Every edit to a saved plan clears its review and confirmation, so save the final text before reviewing.

4. Review (free). Call `autoshort_save_season_plan` with `review: true`. Show the checklist with each rule's pass or fail, the issues of the AI review if it ran (say so if it could not run), and the season price the review reports. Fix every failed check with the user, save again and review again. Do not talk the user past a failed check.

5. Confirmation. Ask: "Confirm this season plan? After this I can price and make episodes from it." Wait for a clear yes in the user's own words. Only then call `autoshort_save_season_plan` with `confirm: true`, `seriesId` and the `planHash` copied exactly from the review answer, without `plan`. If the answer is `PLAN_CHANGED`, nothing was confirmed: review the current plan, show it and ask again. `autoshort_get_season_plan` shows where the plan stands.

6. Produce one episode at a time. For each episode: `autoshort_quote_character_episode` (free) and show the shots, length and exact price; ask "Make episode N for this price?" and wait for a clear yes; then `autoshort_create_character_episode` with `confirm: true`, `expectedCredits` equal to the quoted price and an `idempotencyKey`. If the price changed the tool answers 409 and charges nothing: re-quote and ask again. Poll `autoshort_get_video` about every 30 seconds until COMPLETED or FAILED (an episode takes minutes) and relay errors, refund notes and the per-account limits as the tool states them. Never create an episode that has not been quoted in this conversation and never make several episodes on one yes.

7. After the season, only if asked: `autoshort_get_series_performance` (numbers as returned, not a forecast); `autoshort_get_connection_status` then `autoshort_publish_video` to post; `autoshort_resume_series` to run on a schedule (say that each video is charged when made; `autoshort_pause_series` stops it).

If the tools answer "Sign-in required", tell the user to run `/mcp auth autoshort`.
"""
